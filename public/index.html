<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat ao Vivo • Mensagio</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <main class="container">
      <header class="page-header">
        <h1>Chat ao Vivo</h1>
        <p class="subtitle">Mensagio Tecnologia</p>
      </header>

      <!-- Entrada do usuário no chat -->
      <section id="login-screen" class="card">
        <h2>Como você quer ser chamado?</h2>

        <input
          type="text"
          id="name-input"
          placeholder="Digite seu nome..."
          maxlength="20"
          autocomplete="off"
        />

        <button id="enter-button">Entrar no chat</button>
      </section>

      <!-- Área principal de conversação -->
      <section id="chat-screen" class="card hidden">
        <div class="chat-header">
          <span>Olá, <strong id="user-name"></strong>!</span>
          <button id="logout-button" class="logout-button">Sair</button>
        </div>

        <!-- Indica se o cliente está conectado ao servidor -->
        <div id="connection-status" class="status">
          <span class="dot"></span>
          <span id="status-text">Conectando...</span>
        </div>

        <!-- As mensagens recebidas são inseridas aqui -->
        <div id="message-list" class="message-list"></div>

        <!-- Campo usado para enviar novas mensagens -->
        <div class="message-form">
          <input
            type="text"
            id="message-input"
            placeholder="Digite sua mensagem..."
            autocomplete="off"
          />
          <button id="send-button">Enviar</button>
        </div>
      </section>
    </main>

    <!-- Socket.io é disponibilizado automaticamente pelo servidor -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
